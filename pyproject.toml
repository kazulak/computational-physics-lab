[tool.poetry]
name = "computational-physics-lab"
version = "0.1.0"
description = "A collection of numerical simulations, dynamical systems analysis, and physics visualizations."
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "shared"}]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.24.0"
scipy = "^1.10.0"
matplotlib = "^3.7.0"
sympy = "^1.11.0"
ipykernel = "^6.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.2.0"
black = "^23.1.0"
isort = "^5.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
