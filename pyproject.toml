[project]
name = "cplab"
version = "0.1.0"
description = "Computational physics projects: models, numerical methods, validation."
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cplab"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["cplab", "projects"]
